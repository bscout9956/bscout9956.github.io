<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>US Road Trip</title>

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@2.0.0-beta.2/dist/leaflet.css">
    <script type="importmap">
		{"imports": {"leaflet": "https://cdn.jsdelivr.net/npm/leaflet@2.0.0-beta.2/dist/leaflet.js"}}
	</script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <script src="./utils.js"></script>
    <link rel="stylesheet" href="./style.css" />
</head>

<audio id="bg-music" loop>
    <source id="music-src" src="assets/lscm.mp3" type="audio/mpeg">
</audio>

<body>
    <script type="module" src="./main.js"></script>
    <div class="container">
        <div class="progress-control-container">
            <div class="progress-control gta-font">
                <h1>PC Release Countdown</h1>
                <h2 id="days-remaining"></h2>
            </div>
        </div>


        <div class="map" id="map"></div>

        <footer>
            <div class="distance-traveled gta-font">
                <h2>Distance Traveled: </h2>
                <div id="travel-speed">
                    We're traveling at --- km/h
                </div>
                <div class="player-controls">
                    <i id="play-button" class="bi bi-play-fill"></i>
                    <i id="stop-button" class="bi bi-stop-fill"></i>
                    <div>|</div>
                    <div id="now-playing"></div>
                </div>
            </div>
            <div class="progress-indicator gta-font">
                <div class="progress-bar-bg">
                    <div class="progress-bar-fg">
                    </div>
                </div>
                <div class="percentage-indicator">
                    <div id="distance-progress">
                        X out of X meters
                    </div>
                    <div id="percentage-value">
                        ---
                    </div>
                </div>
            </div>
        </footer>

    </div>
</body>

</html>
